name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the version bump and push the tag
      id-token: write   # OIDC token for npm trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install workspace deps
        run: npm ci

      - name: Sanity build (example app)
        run: npm run build -w examples/minimal

      - name: Bump versions in both packages
        id: bump
        run: |
          # `npm version` updates package.json (and package-lock.json) without
          # tagging. Both packages are kept in lockstep on a single version.
          npm version ${{ inputs.bump_type }} \
            -w packages/viewer-core \
            -w packages/viewer-server \
            --no-git-tag-version

          NEW_VERSION=$(node -p "require('./packages/viewer-core/package.json').version")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to v$NEW_VERSION"

      - name: Commit, tag, push
        run: |
          git add packages/viewer-core/package.json \
                  packages/viewer-server/package.json \
                  package-lock.json
          git commit -m "Release v${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD --tags

      - name: Publish @ideonate/evals-viewer-core
        run: npm publish -w packages/viewer-core --provenance --access public

      - name: Publish @ideonate/evals-viewer-server
        run: npm publish -w packages/viewer-server --provenance --access public
